<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>N-Body Refactor — Render</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #04060a;
      color: #eaf2ff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .hud-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px;
    }

    .hud-stat {
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(5, 10, 18, 0.55);
      border: 1px solid rgba(120, 170, 255, 0.16);
      backdrop-filter: blur(6px);
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .hud-buttons {
      margin-left: auto;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    button {
      appearance: none;
      border: 1px solid rgba(120, 170, 255, 0.22);
      background: rgba(8, 14, 24, 0.72);
      color: #eaf2ff;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1;
      min-width: 44px;
      min-height: 44px;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(1px);
      background: rgba(22, 34, 54, 0.82);
    }

    .hud-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      gap: 18px;
      padding: 18px;
      pointer-events: none;
    }

    .control-button {
      pointer-events: auto;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      font-size: 30px;
      display: grid;
      place-items: center;
      touch-action: none;
    }

    .control-button.small {
      width: 72px;
      height: 72px;
      font-size: 22px;
    }

    /* --- Стили для экрана входа --- */
    #login-screen {
      position: fixed;
      inset: 0;
      background: #04060a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
      text-align: center;
    }

    .login-title {
      font-size: 28px;
      margin-bottom: 12px;
      color: #eaf2ff;
      font-weight: 600;
    }

    .login-subtitle {
      font-size: 16px;
      color: #a0b4d0;
      margin-bottom: 40px;
      max-width: 400px;
      line-height: 1.5;
    }

    .login-input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      width: 100%;
      max-width: 360px;
    }

    .login-input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(120, 170, 255, 0.22);
      background: rgba(8, 14, 24, 0.72);
      color: #eaf2ff;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    .login-input::placeholder {
      color: rgba(234, 242, 255, 0.4);
    }

    .login-input:focus {
      border-color: rgba(120, 170, 255, 0.5);
      background: rgba(12, 20, 36, 0.9);
    }

    .btn-start {
      padding: 16px 40px;
      border-radius: 16px;
      border: 1px solid rgba(120, 170, 255, 0.4);
      background: rgba(60, 120, 255, 0.25);
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      min-width: 240px;
      min-height: 56px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-start:active {
      transform: translateY(2px);
      background: rgba(60, 120, 255, 0.4);
    }

    @media (max-width: 640px) {
      .hud-stat { font-size: 12px; }
      button { padding: 8px 10px; min-width: 40px; min-height: 40px; }
      .control-button { width: 76px; height: 76px; }
      .control-button.small { width: 64px; height: 64px; }
      
      .login-title { font-size: 24px; }
      .login-subtitle { font-size: 15px; }
      .login-input-group { flex-direction: column; }
      .btn-start { width: 100%; max-width: 360px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Экран входа -->
  <div id="login-screen">
    <div class="login-title">Добро пожаловать</div>
    <div class="login-subtitle">
      Исследуйте гравитационные поля, управляйте кораблём и собирайте станции. 
      Для полного погружения игра автоматически развернётся на весь экран и запросит доступ к датчикам движения.
    </div>
    
    <div class="login-input-group">
      <input 
        id="network-id-input" 
        class="login-input" 
        type="text" 
        placeholder="Сетевой ID" 
        autocomplete="off"
      />
      <button id="btn-generate-id">Сгенерировать</button>
    </div>

    <button id="btn-start-game" class="btn-start">Начать игру</button>
  </div>

  <div id="hud">
    <div class="hud-top">
      <div class="hud-stat" id="score">Очки: 0</div>
      <div class="hud-stat" id="room-info" style="cursor: pointer; border-color: rgba(100, 255, 150, 0.4);" title="Нажми, чтобы скопировать ссылку">
        Комната: <span id="room-id">...</span>
      </div>
      <div class="hud-stat" id="status">Игра</div>
      <div class="hud-stat" id="sensor-debug">Датчики: выкл</div>

      <div class="hud-buttons">
	      <button id="btn-pause">Пауза</button>
	      <button id="btn-reset">Сброс</button>
	      <button id="btn-fullscreen" title="Во весь экран">⛶</button>
      </div>
    </div>

    <div class="hud-controls">
      <button id="btn-brake" class="control-button small">■</button>
      <button id="btn-thrust" class="control-button">▶</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
